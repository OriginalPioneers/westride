name: Runner image

# Builds the supporter runner (apps/runner/Dockerfile, repo-root context) and
# publishes it to GHCR. install.sh / install.ps1 pull the :latest tag.
#
# Pull requests only build (no push) so a broken Dockerfile fails the check.
# The package must be set to public once, by hand, in the org's package
# settings: https://github.com/orgs/WeStrideOrg/packages/container/westride-runner/settings

on:
  push:
    branches: [dev]
    paths:
      - apps/runner/**
      - packages/runner-protocol/**
      - package.json
      - bun.lock
      - .github/workflows/runner-image.yml
  pull_request:
    paths:
      - apps/runner/**
      - packages/runner-protocol/**
      - package.json
      - bun.lock
      - .github/workflows/runner-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/westrideorg/westride-runner

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=WeStride supporter runner
            org.opencontainers.image.description=Runs Muse Code jobs for ideas you pledged compute to.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
